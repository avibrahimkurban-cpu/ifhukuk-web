  ozet: Derin siyah zemin, şampanya altını vurgular, klasik ve zarif bir serif.
  fonts: family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@400;500;600

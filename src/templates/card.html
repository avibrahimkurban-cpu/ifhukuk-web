<a class="post-card" href="{{ root }}blog/{{ p.slug }}/" data-cat="{{ p.category }}">
  <span class="pc-meta">{% if p.category %}<b>{{ p.category }}</b>{% endif %}<time datetime="{{ p.date_iso }}">{{ p.date_tr }}</time></span>
  <span class="pc-title">{{ p.title }}</span>
  <span class="pc-ex">{{ p.description }}</span>
  <span class="pc-more">Yazıyı oku →</span>
</a>
